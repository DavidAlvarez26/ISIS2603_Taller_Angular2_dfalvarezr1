<div class="card mb-4">
  <div class="card-body">
    <h5 class="card-title">Nueva Ciudad</h5>

    <form (ngSubmit)="onSave()">
      <div class="mb-3">
        <label for="cityName" class="form-label">Nombre de la ciudad</label>
        <input
          id="cityName"
          name="cityName"
          class="form-control"
          type="text"
          [(ngModel)]="cityName"
        />
      </div>

      <div class="mb-3">
        <label for="country" class="form-label">Pais</label>
        <select
          id="country"
          name="country"
          class="form-select"
          [(ngModel)]="selectedCountryId"
        >
          <option [ngValue]="null">Seleccione un pais</option>
          @for (country of countries; track country.id) {
            <option [ngValue]="country.id">{{ country.name }}</option>
          }
        </select>
      </div>

      <button
        type="submit"
        class="btn btn-primary me-2"
        [disabled]="!cityName.trim() || selectedCountryId === null"
      >
        Guardar
      </button>
      <button type="button" class="btn btn-secondary" (click)="onCancel()">
        Cancelar
      </button>
    </form>
  </div>
</div>
